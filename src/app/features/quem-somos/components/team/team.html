<section class="py-12 bg-light">
  <div class="container mx-auto px-6 max-w-270">
    
    <div class="text-center">
      <h2 class="font-primary text-3xl md:text-4xl font-extrabold text-dark">
        Nossa Equipe
      </h2>
      <p class="text-lg text-muted mx-auto my-6">
        Um grupo 100% voluntário de pessoas que acreditam no poder da solidariedade e da ação conjunta.
      </p>
    </div>

    @if (isLoading()) {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        @for (i of [1,2,3,4,5,6]; track i) {
          <div class="bg-light rounded-3xl p-3 border border-light/80 shadow-sm">
            <div class="w-full aspect-square rounded-2xl bg-muted animate-pulse mb-5"></div>
            
            <div class="px-3 pb-3">
              <div class="h-6 w-24 bg-muted rounded-full animate-pulse mb-3"></div>
              <div class="h-7 w-48 bg-muted rounded-md animate-pulse"></div>
            </div>
          </div>
        }
      </div>

    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        
        @for (member of team(); track member.id) {
          <div class="group flex flex-col bg-light rounded-3xl p-3 border border-primary shadow-[0_2px_15px_rgba(0,0,0,0.03)] transition-all duration-300 hover:shadow-[0_20px_40px_rgba(0,0,0,0.08)] hover:-translate-y-2 cursor-pointer">
            
            <div class="relative w-full aspect-square rounded-2xl overflow-hidden mb-5 bg-light">
              <img [src]="member.photo_url" [alt]="'Foto de ' + member.name" 
                   class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-110">
              
              <div class="absolute inset-0 bg-dark/0 group-hover:bg-dark/5 transition-colors duration-300"></div>
            </div>

            <div class="px-3 pb-3">
              <span class="inline-block px-4 py-1.5 mb-3 rounded-full bg-light/80 text-secondary text-xs font-bold uppercase tracking-wider border border-muted">
                {{ member.role }}
              </span>
              
              <h4 class="font-primary text-xl md:text-2xl font-bold text-dark">
                {{ member.name }}
              </h4>
            </div>

          </div>
        }

      </div>
    }

  </div>
</section>
