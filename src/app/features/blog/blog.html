<div class="w-full">
  <!-- Seção de Introdução -->
  <section class="py-12">
    <div class="max-w-300 mx-auto px-6 text-center">
      <h1 class="font-primary text-secondary font-black block mt-2 text-4xl md:text-5xl lg:text-6xl">Blog</h1>
      <p class="font-secondary text-dark leading-relaxed m-0 text-xl md:text-2xl lg:text-3xl">Notícias, histórias e atualizações sobre o trabalho e o impacto do Instituto Abrace.</p>
    </div>
  </section>

  <app-blog-featured [post]="featuredPost()" [isLoading]="isLoading()">
  </app-blog-featured>

  <div class="text-center py-12 bg-dark">
    <h2 class="font-primary text-3xl md:text-4xl font-bold text-light mb-4">
      Nossas Atualizações
    </h2>
    <p class="text-lg text-light/80 max-w-2xl mx-auto mb-8">
      Abaixo você pode conferir notícias, histórias e atualizações do Instituto Abrace.
    </p>
    <div class="flex justify-center mt-8">
      <div class="animate-bounce flex items-center justify-center rounded-full bg-dark text-accent">
        <i class="fas fa-chevron-down text-3xl"></i>
      </div>
    </div>
  </div>

  <app-blog-posts></app-blog-posts>

</div>
