<div class="min-h-screen bg-linear-to-tr/longer from-primary to-secondary py-12 px-4 sm:px-6 flex items-center justify-center">
  <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden">

    <div class="bg-slate-50 border-b border-slate-100 p-8 text-center">
      <h2 class="font-primary text-3xl font-extrabold text-dark m-0">
        {{ isEditMode() ? 'Editar Membro' : 'Cadastrar Membro da Equipe' }}
      </h2>
    </div>

    <div class="p-8 md:p-10">
      <form [formGroup]="teamForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <div>
          <label for="name" class="block text-sm font-bold text-slate-700 mb-2">Nome</label>
          <input type="text" id="name" formControlName="name"
                 class="w-full px-4 py-3 rounded-xl bg-slate-50 border transition-colors focus:outline-none focus:ring-2 focus:ring-primary"
                 [ngClass]="isInvalid('name') ? 'border-red-400' : 'border-slate-200'">
          @if (isInvalid('name')) {
            <p class="text-red-500 text-sm mt-1">O nome é obrigatório.</p>
          }
        </div>

        <div>
          <label for="role" class="block text-sm font-bold text-slate-700 mb-2">Cargo / Função</label>
          <input type="text" id="role" formControlName="role" placeholder="Ex: Coordenação, Voluntário..."
                 class="w-full px-4 py-3 rounded-xl bg-slate-50 border transition-colors focus:outline-none focus:ring-2 focus:ring-primary"
                 [ngClass]="isInvalid('role') ? 'border-red-400' : 'border-slate-200'">
          @if (isInvalid('role')) {
            <p class="text-red-500 text-sm mt-1">O cargo é obrigatório.</p>
          }
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="order_index" class="block text-sm font-bold text-slate-700 mb-2">Ordem de exibição</label>
            <input type="number" id="order_index" formControlName="order_index" min="0"
                   class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary">
          </div>

          <div>
            <label for="active" class="block text-sm font-bold text-slate-700 mb-2">Status</label>
            <select id="active" formControlName="active"
                    class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary cursor-pointer">
              <option [ngValue]="true">Ativo (visível na página)</option>
              <option [ngValue]="false">Inativo</option>
            </select>
          </div>
        </div>

        <div>
          <label for="photoFile" class="block text-sm font-bold text-slate-700 mb-2">Foto</label>
          <input type="file" id="photoFile" (change)="onFileSelected($event)" accept="image/png, image/jpeg, image/webp"
                 class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">

          @if (imagePreview()) {
            <div class="mt-4">
              <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Pré-visualização</p>
              <img [src]="imagePreview()" alt="Pré-visualização da foto"
                   class="w-32 h-32 object-cover rounded-xl border border-slate-200 shadow-sm">
            </div>
          }
        </div>

        <div class="flex flex-col-reverse sm:flex-row justify-end items-center gap-4 pt-8 mt-4 border-t border-slate-100">
          <a routerLink="/admin/team" class="w-full sm:w-auto px-6 py-3 font-bold text-slate-500 hover:text-slate-800 transition-colors text-center">
            Cancelar
          </a>
          <button type="submit" [disabled]="teamForm.invalid || isUploading()"
                  class="w-full sm:w-auto px-8 py-3 bg-primary hover:bg-[#02626d] text-white font-bold rounded-full transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            @if (isUploading()) {
              <i class="fas fa-spinner fa-spin"></i>
              <span>Salvando...</span>
            } @else {
              <i class="fas fa-save"></i>
              <span>{{ isEditMode() ? 'Salvar Alterações' : 'Cadastrar Membro' }}</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
