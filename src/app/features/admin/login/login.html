<div class="login-container">
  <div class="login-card">
    
    <div class="login-header">
      <img src="assets/images/abracelogo.png" alt="Logo Instituto AbraceRS" class="login-logo">
      <h3 class="card-title">Acesso Administrativo</h3>
      <p>Área de Administração do Sistema.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <div class="input-wrapper" [class.is-invalid]="isInvalid('email')">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" formControlName="email" placeholder="Digite seu e-mail">
        </div>
        @if (isInvalid('email')) {
          <div class="invalid-feedback">Por favor, insira um e-mail válido.</div>
        }
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Senha</label>
        <div class="input-wrapper" [class.is-invalid]="isInvalid('password')">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" formControlName="password" placeholder="Digite sua senha">
        </div>
        @if (isInvalid('password')) {
          <div class="invalid-feedback">A senha é obrigatória.</div>
        }
      </div>

      @if (errorMessage()) {
        <div class="alert-danger">
          <i class="fas fa-exclamation-triangle"></i> {{ errorMessage() }}
        </div>
      }

      <button type="submit" class="btn-submit" [disabled]="isLoading()">
        @if (isLoading()) {
          <i class="fas fa-spinner fa-spin"></i> Entrando...
        } @else {
          Entrar no Sistema
        }
      </button>

    </form>

    <div class="login-footer">
      <a routerLink="/" class="back-link"><i class="fas fa-arrow-left"></i> Voltar para a Home</a>
    </div>
    
  </div>
</div>
