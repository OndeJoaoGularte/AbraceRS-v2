<div class="w-full">

  <!-- Seção Banner -->
  <app-hero></app-hero>

  <!-- Seção de Introdução -->
  <section class="py-12">
    <div class="max-w-300 mx-auto px-6 text-center">
      <h2 class="font-primary text-secondary font-extrabold leading-tight m-0 text-3xl md:text-4xl lg:text-5xl">
        Nós,<br>
        <strong class="font-primary text-secondary font-black block mt-2 text-5xl md:text-6xl lg:text-7xl">
          do Instituto Abrace
        </strong>
      </h2>
    </div>
  </section>

  <!-- Seção Sobre Nós -->
  <app-about></app-about>

  <!-- Seção de Projetos -->
  <app-projects [isLoading]="isLoading()" [featured]="featuredProject()" [secondary]="secondaryProjects()">
  </app-projects>

  <!-- Seção para Voluntariado (ou Associar) -->
  <app-associate></app-associate>

  <!-- Seção de Apoiadores do Instituto -->
  <app-supporters [isLoading]="isLoading()" [masters]="masterSupporters()" [standards]="standardSupporters()"></app-supporters>

  <!-- Seção de Citação -->
  <section class="py-14 bg-dark">
    <div class="max-w-300 mx-auto px-6 text-center">
      <p class="font-secondary text-2xl md:text-3xl lg:text-4xl italic font-bold text-light max-w-250 mx-auto leading-relaxed">
        "Cada doação, cada voluntário, cada gesto de apoio se transforma em um abraço de esperança para quem perdeu tudo."
      </p>
    </div>
  </section>

  <!-- Seção de Call-to-Action -->
  <section id="donate" class="pt-12 bg-light">
    <div class="max-w-300 mx-auto px-6 text-center">
      <p class="font-secondary text-dark leading-relaxed m-0 text-xl md:text-2xl lg:text-3xl">
        A reconstrução é uma maratona, não uma corrida. <br>
        <strong class="text-primary font-extrabold">Nos ajude a continuar ajudando</strong> <br>
        e faça parte desta jornada.
      </p>
    </div>
  </section>

  <app-donate></app-donate>

  <!-- Seção de Posts Recentes -->
  <app-posts [isLoading]="isLoading()" [posts]="latestPosts()" [allLoaded]="allPostsLoaded()" (onLoadMore)="loadMorePosts()">
  </app-posts>

  <!-- Seção Final -->
  <section class="py-20">
    <div class="max-w-300 mx-auto px-6 text-center">
      <h2 class="font-primary text-secondary font-extrabold leading-tight m-0 text-3xl md:text-4xl lg:text-5xl">
        Instituto Abrace RS,<br>
        <strong class="font-primary text-secondary font-black block mt-2 text-5xl md:text-6xl lg:text-7xl">
          o povo pelo povo.
        </strong>
      </h2>
    </div>
  </section>

</div>
