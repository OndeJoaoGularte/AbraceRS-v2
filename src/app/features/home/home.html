<div class="home-page">

  <!-- Banner Inicial -->
  <app-hero></app-hero>

  <!-- Seção de Destaque -->
  <section class="breakout-section">
    <div class="container">
      <h2 class="breakout-title">
        Nós,<br>
        <strong class="breakout-highlight">do Instituto Abrace</strong>
      </h2>
    </div>
  </section>

  <!-- Seção Sobre Nós -->
  <app-about></app-about>

  <!-- Seção de Projetos -->
  @if (!isLoading()) {
    <app-projects 
      [featured]="featuredProject()" 
      [secondary]="secondaryProjects()">
    </app-projects>
  }
  

  <!-- Seção de convite para se voluntariar (ou associar) -->
  <app-associate></app-associate>

  <!-- Seção de Apoiadores do Instituto -->
  <app-supporters [masters]="masterSupporters()" [standards]="standardSupporters()">
  </app-supporters>

  <!-- Seção de Citação -->
  <section class="quote-section">
    <div class="container">
      <p class="quote-text">"Cada doação, cada voluntário, cada gesto de apoio se transforma em um abraço de esperança para quem perdeu tudo."</p>
    </div>
  </section>

  <!-- Seção de Call-to-Action -->
  <app-donate></app-donate>
  
  <!--
  <app-posts 
    [posts]="latestPosts()" 
    [allLoaded]="allPostsLoaded()"
    (onLoadMore)="loadMorePosts()">
  </app-posts>
  -->

  <section class="breakout-section final-breakout">
    <div class="container">
      <h2 class="breakout-title">
        Instituto Abrace RS,<br>
        <strong class="breakout-highlight">o povo pelo povo.</strong>
      </h2>
    </div>
  </section>

</div>
