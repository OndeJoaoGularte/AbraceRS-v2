<section class="relative bg-cover bg-center text-light flex items-center justify-center text-center h-[calc(100vh-70px)] lg:h-[calc(100vh-110px)]" [style.background-image]="'linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url(' + heroImageUrl + ')'">

  <div class="relative z-10 px-6 max-w-300 w-full mx-auto">

    <h1 class="font-primary font-bold mb-4 text-3xl md:text-4xl lg:text-5xl">
      O Rio Grande do Sul precisa de nós
    </h1>

    <p class="font-secondary mb-10 leading-relaxed opacity-90 text-lg md:text-xl lg:text-2xl">
      Sua doação transforma vidas e reconstrói esperanças.<br>Junte-se ao Instituto AbraceRS.
    </p>

    <a routerLink="/junte-se" [queryParams]="{ form: 'volunteer' }" class="inline-block bg-accent text-dark font-primary font-bold no-underline py-4 px-10 rounded-full transition-all duration-300 ease-in-out text-lg lg:text-xl hover:bg-[color-mix(in_srgb,var(--color-accent),black_5%)] hover:-translate-y-2 hover:scale-130 hover:shadow-[0_10px_20px_rgba(0,0,0,0.2)]">
      Quero ajudar agora
    </a>

  </div>
</section>
